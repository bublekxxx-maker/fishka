<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Фишка — покерный тренажёр</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Фишка">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F2EFF5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1D1A23" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root,[data-theme="light"]{
  --bg:#F2EFF5; --surf:#FBFAFC; --felt:#DED6E8; --line:#C9BDDA; --ink:#2E2A38; --mute:#6F6780; --soft:#E8E3EE;
  --accent:#7E6C9E; --onAccent:#FFFFFF; --blue:#9AAEC8; --onBlue:#1F2A3C; --card:#FFFFFF; --cardLine:#E2DCE9;
  --red:#B65F6C; --black:#3A3545; --back:#B9AACF; --backLine:#FFFFFF; --sheet:#FFFFFF; --shade:rgba(46,42,56,.28);
  --c1:#FFFFFF; --c1r:#CFC5DD; --c5:#C9B8E0; --c5r:#A895C6; --c25:#AFC1D9; --c25r:#8EA3C2; --c100:#5A5068; --c100r:#3F3750; --c05:#E8E3EE; --c05r:#C9BDDA;
  --good:#5E9C7A; --bad:#B65F6C; --gridOff:#EFEBF3; --gridOn:#8FB8A0; --gridBot:#A894CC;
}
[data-theme="dark"]{
  --bg:#1D1A23; --surf:#26222E; --felt:#302A3B; --line:#443B54; --ink:#ECE8F2; --mute:#A59DB3; --soft:#2F2A38;
  --accent:#B3A2D4; --onAccent:#1D1A23; --blue:#8EA2BF; --onBlue:#141B27; --card:#EEEAF3; --cardLine:#D6CFE0;
  --red:#B65F6C; --black:#3A3545; --back:#6B5D86; --backLine:#8A7BA6; --sheet:#26222E; --shade:rgba(0,0,0,.5);
  --c1:#EEEAF3; --c1r:#BDB3CC; --c5:#B7A6D6; --c5r:#9584B8; --c25:#9DB1CD; --c25r:#7D93B3; --c100:#4A4258; --c100r:#6A5F80; --c05:#3A3446; --c05r:#56496A;
  --good:#8FC4A6; --bad:#E0909A; --gridOff:#2F2A38; --gridOn:#5E8F74; --gridBot:#7E6BA6;
}
:root{ --cw:clamp(52px,15.5vw,66px); --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --brass2:var(--accent); --ivory:var(--ink); }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,sans-serif;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none;transition:background .3s}
button,input{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.app{position:relative;max-width:480px;height:100dvh;margin:0 auto;display:flex;flex-direction:column;padding:calc(var(--safe-t) + 10px) 14px calc(var(--safe-b) + 12px)}
.screen{display:none;flex:1;flex-direction:column;min-height:0}
.screen.on{display:flex}
.lbl{font-size:11px;font-weight:700;letter-spacing:1.6px;color:var(--mute);text-transform:uppercase}

/* ---------- start ---------- */
#start{gap:14px;overflow-y:auto;padding:8px 2px}
.brand{display:flex;align-items:center;gap:12px;margin:6px 0 4px}
.brand .t{font-size:28px;font-weight:800;letter-spacing:-.5px;line-height:1}
.brand .s{font-size:13px;color:var(--mute);margin-top:4px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{text-align:left;padding:14px 13px;border-radius:18px;background:var(--surf);border:1px solid var(--line);transition:.15s;display:flex;flex-direction:column;gap:6px;min-height:118px}
.mode .mi{width:34px;height:34px;border-radius:10px;background:var(--soft);display:flex;align-items:center;justify-content:center;color:var(--accent)}
.mode .mt{font-size:15px;font-weight:800}
.mode .md{font-size:12px;color:var(--mute);line-height:1.35}
.mode .new{position:absolute;top:10px;right:10px;font-size:10px;font-weight:800;letter-spacing:1px;color:var(--onAccent);background:var(--accent);padding:2px 7px;border-radius:6px}
.mode{position:relative}
.mode.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.optrow{display:flex;flex-direction:column;gap:6px}
.seg{display:flex;background:var(--soft);border-radius:14px;padding:4px}
.seg button{flex:1;padding:10px 6px;border-radius:10px;font-weight:700;font-size:14px;color:var(--mute)}
.seg button.on{background:var(--surf);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.levdesc{font-size:12px;color:var(--mute);line-height:1.45}
.big-btn{font-weight:800;font-size:16px;padding:17px 22px;border-radius:16px;background:var(--accent);color:var(--onAccent);transition:transform .1s;width:100%}
.big-btn:active{transform:scale(.98)}
.ghost-btn{font-weight:700;font-size:14px;padding:13px 16px;border-radius:14px;border:1px solid var(--line);background:var(--surf);color:var(--ink)}
.duelin{display:flex;gap:8px}
.duelin input{flex:1;min-width:0;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surf);font-weight:800;letter-spacing:2px;text-transform:uppercase;cursor:text}
.duelin input::placeholder{letter-spacing:0;font-weight:500;color:var(--mute);text-transform:none}
.err{font-size:12px;color:var(--bad);min-height:14px}
.themebtn{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--mute);padding:6px 0}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surf);color:var(--mute);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.icon-btn svg{width:16px;height:16px}
.dots{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;flex:1;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--soft);box-shadow:inset 0 0 0 1px var(--line)}
.dots.many .dot{width:6px;height:6px}
.dot.cur{width:18px;border-radius:4px;background:var(--accent);box-shadow:none}
.toptxt{font-size:12px;font-weight:700;color:var(--mute);text-align:center;flex:1}

/* ---------- table ---------- */
.tablewrap{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;justify-content:center}
.rail{position:relative;flex:1;min-height:300px;max-height:470px;margin:6px 4px 0}
.felt{position:absolute;inset:0;border-radius:44% / 30%;background:var(--felt);box-shadow:0 0 0 8px var(--soft),0 0 0 9px var(--line)}
.ring{position:absolute;inset:0;pointer-events:none}
.plaque{position:absolute;transform:translate(-50%,-50%);font-size:11px;font-weight:600;padding:4px 9px;border-radius:999px;background:var(--surf);color:var(--mute);white-space:nowrap;border:1px solid var(--line);z-index:3}
.plaque.out{opacity:.85}
.plaque.live{color:var(--ink)}
.plaque.call{background:var(--accent);color:var(--onAccent);border-color:var(--accent)}
.dealer{position:absolute;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;background:var(--surf);border:1px solid var(--line);color:var(--ink);font-weight:800;font-size:11px;display:flex;align-items:center;justify-content:center;z-index:3;transition:left .3s,top .3s}
.opp{position:absolute;left:0;right:0;top:4%;display:flex;flex-direction:column;align-items:center;gap:4px;z-index:4}
.ava{width:56px;height:56px;border-radius:50%;background:var(--surf);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;color:var(--mute)}
.ava.boss{background:#3E6E8E;color:#F3EEF9;border-color:#3E6E8E}
.vname{font-weight:800;font-size:15px;margin-top:2px}
.vtag{font-size:12px;color:var(--mute);text-align:center}
.vcards{position:absolute;left:10%;top:6%;display:flex;gap:3px;z-index:4}
.vcards .card{--cw:34px}
.vstackbox{position:absolute;right:9%;top:5%;display:flex;flex-direction:column;align-items:center;gap:4px;z-index:4}
.amt{font-size:12px;font-weight:700;color:var(--ink);background:var(--surf);border:1px solid var(--line);padding:3px 9px;border-radius:999px;white-space:nowrap}
.amt.allin{background:var(--accent);color:var(--onAccent);border-color:var(--accent)}
.bubble{position:absolute;top:-10px;left:50%;transform:translate(-50%,-100%) scale(.9);background:var(--surf);color:var(--ink);font-size:13px;font-weight:600;line-height:1.3;padding:7px 12px;border-radius:14px;max-width:82%;opacity:0;transition:.25s;pointer-events:none;z-index:8;box-shadow:0 6px 16px rgba(0,0,0,.12);border:1px solid var(--line);text-align:center}
.bubble.on{opacity:1;transform:translate(-50%,-100%) scale(1)}
.bet{position:absolute;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:6px;z-index:4;transition:opacity .25s}
.bet.v{top:28%}
.bet.h{bottom:9%}
.bet:empty{opacity:0}
.center{position:absolute;left:0;right:0;top:58%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:9px;z-index:2}
.street{font-size:11px;font-weight:700;letter-spacing:2px;color:var(--mute);text-transform:uppercase;min-height:13px;text-align:center}
.board{display:flex;gap:5px}
.board .slot{width:calc(var(--cw)*.76);aspect-ratio:5/7;border-radius:7px;border:1.5px dashed var(--line)}
.board .card{--cw:calc(clamp(52px,15.5vw,66px)*.76)}
.potrow{display:flex;gap:8px;align-items:center;justify-content:center;min-height:28px}
.ante{font-size:11px;font-weight:600;color:var(--mute)}
.ante.no{color:#5A3A10;background:#E6CB97;padding:3px 8px;border-radius:999px}
.log{font-size:13px;color:var(--mute);min-height:18px;opacity:0;transition:.2s;text-align:center}
.log.on{opacity:1}
.eqbar{width:76%;max-width:280px;opacity:0;transition:opacity .3s}
.eqbar.on{opacity:1}
.eqlabels{display:flex;justify-content:space-between;font-size:12px;font-weight:700;margin-bottom:4px;color:var(--ink)}
.eqtrack{height:6px;border-radius:3px;background:var(--bad);overflow:hidden}
.eqfill{height:100%;background:var(--accent);width:50%;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.banner{position:absolute;left:50%;top:58%;transform:translate(-50%,-50%) scale(.85);font-weight:800;font-size:18px;padding:10px 18px;border-radius:14px;background:var(--surf);border:1px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.12);opacity:0;transition:.25s;white-space:nowrap;z-index:9;pointer-events:none;max-width:92%;overflow:hidden;text-overflow:ellipsis;color:var(--ink)!important}
.banner.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.mearea{position:relative;display:flex;align-items:flex-end;justify-content:center;gap:12px;margin-top:-50px;z-index:5;min-height:calc(var(--cw)*1.45)}
.hcards{display:flex;gap:6px;position:relative}
.hcards .card:nth-child(1){transform:rotate(-3deg)} .hcards .card:nth-child(2){transform:rotate(3deg)}
.mystack{display:flex;flex-direction:column;align-items:center;gap:4px;position:absolute;right:8px;bottom:6px}
.mini-badge{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%) scale(0);opacity:0;pointer-events:none;z-index:10}
.mini-badge.on{animation:mb 1.4s cubic-bezier(.2,1.5,.4,1) forwards}
@keyframes mb{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}18%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-4deg)}78%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-4deg)}100%{opacity:0;transform:translate(-50%,-50%) scale(.95) rotate(-4deg)}}
.hud{display:flex;align-items:center;gap:10px;padding:8px 6px 2px}
.hud .pos{font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--surf);border:1px solid var(--line)}
.hud .hn{font-size:17px;font-weight:800}
.hud .hn small{font-size:12px;font-weight:500;color:var(--mute);margin-left:6px}
.hud .eq{margin-left:auto;width:132px;font-size:12px;color:var(--mute)}
.hud .eq .row1{display:flex;justify-content:space-between}
.hud .eq b{color:var(--ink);font-weight:800}
.wrbar{height:4px;border-radius:2px;background:var(--soft);margin-top:4px;overflow:hidden}
.wrbar i{display:block;height:100%;background:var(--accent);width:0;transition:width .5s}

/* ---------- actions ---------- */
.actions{display:grid;grid-template-columns:48px repeat(2,1fr);gap:8px;padding-top:10px;align-items:center}
.act{height:56px;border-radius:16px;font-weight:800;font-size:16px;transition:transform .1s,opacity .2s;position:relative;line-height:1.1;display:flex;flex-direction:column;align-items:center;justify-content:center}
.act small{display:block;font-size:11px;font-weight:600;opacity:.75;margin-top:2px}
.act:active{transform:scale(.96)}
.act:disabled{opacity:.35;pointer-events:none}
.act.fold{background:var(--surf);color:var(--ink);border:1px solid var(--line)}
.act.mid{background:var(--blue);color:var(--onBlue)}
.act.go,.act.more{background:var(--accent);color:var(--onAccent)}
.act.hint{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--surf);color:var(--mute);font-size:18px}
.act.hint .cnt{position:absolute;top:-4px;right:-4px;width:18px;height:18px;border-radius:50%;background:var(--accent);color:var(--onAccent);font-size:10px;display:flex;align-items:center;justify-content:center}
.act.hint.used{background:var(--soft)}
.sizes{display:none;grid-template-columns:repeat(3,1fr);gap:8px;padding-top:10px}
.sizes.on{display:grid}
.sizes .act{height:52px;font-size:14px;background:var(--accent);color:var(--onAccent)}
.sizes .act.allin{background:var(--ink);color:var(--bg)}
.sizes .act.back{background:var(--surf);color:var(--ink);border:1px solid var(--line)}
.hintbox{font-size:13.5px;line-height:1.5;background:var(--soft);color:var(--ink);border-radius:14px;padding:11px 13px;margin-top:10px;display:none}
.hintbox.on{display:block;animation:fadein .25s}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}}

/* ---------- chips ---------- */
.chips{display:flex;align-items:flex-end;gap:2px}
.cstack{display:flex;flex-direction:column-reverse;align-items:center}
.chip{width:var(--chs,18px);height:var(--chs,18px);border-radius:50%;background:var(--cc);border:2px solid var(--cr);box-shadow:inset 0 0 0 3px var(--cc),inset 0 0 0 4px var(--cr);flex-shrink:0}
.cstack .chip+.chip{margin-bottom:calc(var(--chs,18px) * -.8)}

/* ---------- cards ---------- */
.card{width:var(--cw);aspect-ratio:5/7;perspective:600px;position:relative;flex-shrink:0}
.card .in{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.3,.7,.3,1)}
.card.down .in{transform:rotateY(180deg)}
.card .face,.card .back{position:absolute;inset:0;border-radius:calc(var(--cw)*.14);backface-visibility:hidden;-webkit-backface-visibility:hidden}
.card .face{background:var(--card);border:1px solid var(--cardLine);color:var(--black);font-weight:700}
.card .face.red{color:var(--red)}
.card .ix{position:absolute;left:calc(var(--cw)*.1);top:calc(var(--cw)*.06);display:flex;flex-direction:column;align-items:center;line-height:1}
.card .r{font-size:calc(var(--cw)*.34)}
.card .s{font-size:calc(var(--cw)*.24);font-weight:400}
.card .big{position:absolute;right:calc(var(--cw)*.1);bottom:calc(var(--cw)*.06);font-size:calc(var(--cw)*.46);line-height:1;font-weight:400}
.card .back{transform:rotateY(180deg);background:var(--back);border:2px solid var(--backLine)}
.card.deal{animation:deal .35s cubic-bezier(.2,.8,.2,1) both}
@keyframes deal{from{transform:translateY(-50px) scale(.7);opacity:0}}
.card.win .face{box-shadow:0 0 0 3px var(--accent)}
.card.dim{opacity:.4}

/* ---------- grade marks ---------- */
.badge{width:26px;height:26px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--gc);color:var(--gi)}
.badge svg{width:62%;height:62%}
.medal,.stamp{width:76px;height:100px;border-radius:14px;background:var(--gc);color:var(--gi);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;transform:rotate(-4deg);flex-shrink:0}
.medal svg,.stamp svg{width:34px;height:34px}
.medal .lbl,.stamp .lbl{font-size:10px;font-weight:700;text-align:center;line-height:1.15;padding:0 6px}
.mini-badge .medal,.mini-badge .stamp{width:62px;height:80px;box-shadow:0 10px 24px rgba(0,0,0,.18)}
.mini-badge svg{width:28px;height:28px}

/* ---------- review sheet ---------- */
.sheet-bg{position:fixed;inset:0;background:var(--shade);opacity:0;pointer-events:none;transition:.3s;z-index:20}
.sheet-bg.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;width:100%;max-width:480px;transform:translate(-50%,105%);transition:transform .4s cubic-bezier(.2,.8,.2,1);background:var(--sheet);color:var(--ink);border-radius:28px 28px 0 0;padding:12px 20px calc(var(--safe-b) + 16px);z-index:21;max-height:90dvh;overflow-y:auto}
.sheet::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.sheet.on{transform:translate(-50%,0)}
.l1{display:flex;align-items:center;gap:18px;padding:4px 0}
.l1 .verdict{flex:1;min-width:0}
.l1 .vt{font-size:20px;font-weight:800;line-height:1.2}
.l1 .vn{font-size:14px;font-weight:700;margin-top:6px}
.l1 .vn.bad{color:var(--bad)} .l1 .vn.good{color:var(--good)}
.l1 .vs{font-size:12px;color:var(--mute);margin-top:4px;line-height:1.35}
.result{font-size:14px;line-height:1.5;padding:12px 14px;border-radius:14px;background:var(--soft);color:var(--mute);margin:12px 0 4px}
.result b{color:var(--ink)}
.layer{display:none;padding-top:8px}
.layer.open{display:block;animation:fadein .25s}
.toggle{width:100%;display:flex;justify-content:space-between;align-items:center;padding:13px 2px;font-weight:700;font-size:14px;color:var(--accent);border-bottom:1px solid var(--line)}
.evrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 10px}
.evbox{border-radius:14px;padding:11px 12px;border:1px solid var(--line)}
.evbox.best{border:1.5px solid #9CC2AC}
.evbox .k{font-size:11px;font-weight:700;letter-spacing:1px;color:var(--mute);display:flex;justify-content:space-between;text-transform:uppercase}
.evbox .k em{font-style:normal;color:var(--good)}
.evbox .a{font-size:15px;font-weight:800;margin-top:4px}
.evbox .v{font-size:18px;font-weight:800;margin-top:3px}
.evbox .d{font-size:12px;color:var(--mute);margin-top:1px}
.evbox .h{font-size:12px;font-weight:600;margin-top:4px;color:var(--mute)}
.explain{font-size:14px;line-height:1.55}
.explain p{margin-bottom:8px}
.explain .warn{background:#E6CB9744;border-radius:10px;padding:8px 10px}
.explain .tip{color:var(--mute)}
.math{font-size:13.5px;line-height:1.55}
.math p{margin-bottom:6px}
.math .eq{font-weight:700;font-size:13px;background:var(--soft);padding:6px 9px;border-radius:8px;display:block;margin:3px 0 9px}
.optlist{display:flex;flex-direction:column;gap:4px;margin:6px 0}
.optlist div{display:flex;justify-content:space-between;padding:7px 10px;border-radius:9px;background:var(--soft);font-size:13.5px}
.optlist div span:last-child{font-weight:700}
.optlist div.best{box-shadow:inset 0 0 0 1.5px #9CC2AC}
.optlist div.me{box-shadow:inset 0 0 0 1.5px var(--accent)}
.optlist div.best.me{box-shadow:inset 0 0 0 1.5px #9CC2AC,inset 0 0 0 3px var(--accent)}
.gridwrap{margin-top:10px}
.tabs{display:flex;gap:6px;margin-bottom:8px;background:var(--soft);border-radius:12px;padding:3px}
.tabs button{flex:1;padding:8px;border-radius:9px;font-size:12px;font-weight:700;color:var(--mute)}
.tabs button.on{background:var(--surf);color:var(--ink)}
.gridtitle{font-size:12.5px;color:var(--mute);margin-bottom:6px}
.grid{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:2px;border-radius:8px;overflow:hidden}
.grid div{aspect-ratio:1;min-width:0;overflow:hidden;font-size:clamp(6px,1.9vw,9px);font-weight:700;display:flex;align-items:center;justify-content:center;color:var(--mute);background:var(--gridOff);border-radius:2px}
.grid div.sh{color:#fff}
.grid div.me{outline:2px solid var(--ink);outline-offset:-2px;color:var(--ink)!important;background:#E6CB97!important}
.legend{display:flex;gap:12px;font-size:11.5px;color:var(--mute);margin-top:6px;flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px;background:var(--c)}
.next{margin-top:14px}
.handline{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;margin-top:6px;color:var(--ink)}
.handline b{font-weight:800}
.red{color:var(--red)}
.timeline{display:flex;gap:6px;overflow-x:auto;padding:8px 0 4px;scrollbar-width:none}
.timeline::-webkit-scrollbar{display:none}
.tl{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px;border-radius:12px;border:1px solid var(--line);min-width:62px;position:relative}
.tl.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.tl .st{font-size:10px;font-weight:700;color:var(--mute);letter-spacing:1px;text-transform:uppercase}
.tl .ac{font-size:11px;font-weight:600;white-space:nowrap}
.tl .key{position:absolute;top:-8px;right:-6px;font-size:9px;font-weight:800;background:var(--bad);color:#fff;padding:1px 5px;border-radius:5px}
.dtitle{font-size:16px;font-weight:800;display:flex;align-items:center;gap:10px;margin-top:10px}

/* ---------- result / summary / aquarium ---------- */
#summary,#aqua,#result{overflow-y:auto;padding:6px 2px 10px;gap:12px}
.card2{background:var(--surf);border:1px solid var(--line);border-radius:22px;padding:18px}
.bignum{font-size:60px;font-weight:800;line-height:1;letter-spacing:-1px}
.verdict2{font-size:14.5px;line-height:1.5;color:var(--mute)}
.counts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.cnt{display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 0;border-bottom:1px solid var(--line)}
.cnt b{margin-left:auto;font-size:15px}
.hist{display:flex;flex-direction:column}
.hitem{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line);font-size:13px;width:100%;text-align:left}
.hitem .n{color:var(--mute);width:16px;font-weight:700}
.hitem .mid{flex:1;min-width:0}
.hitem .mid small{display:block;color:var(--mute);font-size:11.5px;margin-top:1px}
.hitem .r{font-weight:800}
.hitem .mb{display:inline-flex;gap:2px;vertical-align:middle}
.hitem .mb .badge{width:15px;height:15px;border-radius:4px}
.row{display:flex;gap:10px}
.row>*{flex:1}
.codebox{display:flex;align-items:center;justify-content:center;gap:10px;font-size:28px;font-weight:800;letter-spacing:4px;padding:16px;border-radius:16px;background:var(--soft)}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;text-align:center}
.vs .who{font-size:12px;font-weight:700;color:var(--mute);letter-spacing:1px}
.vs .n{font-size:40px;font-weight:800}
.vs .x{font-size:14px;font-weight:800;color:var(--mute)}
/* aquarium map */
.depth{display:flex;flex-direction:column;gap:10px}
.depthrow{display:flex;align-items:center;gap:10px}
.depthrow .dn{width:92px;font-size:12px;font-weight:700;color:var(--mute)}
.bub{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);background:var(--surf);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:var(--mute);flex-shrink:0}
.bub.done{background:var(--soft);color:var(--good);border-color:var(--good)}
.bub.cur{background:var(--accent);color:var(--onAccent);border-color:var(--accent);box-shadow:0 0 0 4px var(--soft)}
.bub.boss{width:48px;height:48px;font-size:12px}
.bub.boss.todo{background:#3E6E8E;color:#F3EEF9;border-color:#3E6E8E;opacity:.8}
.line{flex:1;height:2px;background:var(--line);max-width:18px}
.perks{display:flex;flex-wrap:wrap;gap:6px}
.perk{font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;background:var(--soft);color:var(--ink)}
.pick{display:flex;flex-direction:column;gap:10px}
.pickc{text-align:left;padding:16px;border-radius:18px;border:1px solid var(--line);background:var(--surf);display:flex;gap:14px;align-items:center;width:100%}
.pickc .pi{width:44px;height:44px;border-radius:12px;background:var(--soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.pickc .pt{font-size:15px;font-weight:800}
.pickc .pd{font-size:12.5px;color:var(--mute);margin-top:2px;line-height:1.35}
.pickc:active{transform:scale(.98)}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stat3 b{display:block;font-size:20px;font-weight:800}
.stat3 span{font-size:11px;color:var(--mute);font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 24px);transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);font-weight:700;padding:10px 16px;border-radius:12px;opacity:0;transition:.3s;z-index:40;font-size:14px;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}
.shake{animation:shake .5s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.flash{position:fixed;inset:0;pointer-events:none;z-index:30;opacity:0}
.flash.red{background:radial-gradient(circle,rgba(182,95,108,0),rgba(182,95,108,.3));animation:fl .6s}
.flash.cyan{background:radial-gradient(circle,rgba(62,110,142,0),rgba(62,110,142,.3));animation:fl .7s}
@keyframes fl{30%{opacity:1}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:35}
.dossier{position:fixed;inset:0;background:var(--shade);display:none;align-items:center;justify-content:center;z-index:25;padding:20px}
.dossier.on{display:flex;animation:fadein .2s}
.dcard{width:100%;max-width:380px;background:var(--sheet);border-radius:24px;padding:20px;color:var(--ink);max-height:85dvh;overflow-y:auto}
.ava{cursor:pointer}
@media (max-height:720px){.rail{min-height:250px}.ava{width:46px;height:46px;font-size:15px}.act{height:50px}.mearea{margin-top:-40px}}
</style>

// Card: 0..51, rank = c>>2 (0='2' .. 12='A'), suit = c&3
function straightHigh(mask){
  const m = ((mask << 1) | ((mask >> 12) & 1)) & 0x3FFF;
  const s = m & (m >> 1) & (m >> 2) & (m >> 3) & (m >> 4);
  if (!s) return -1;
  return (31 - Math.clz32(s)) + 3;
}
function topBits(mask, n){
  let v = 0, k = 0;
  for (let r = 12; r >= 0 && k < n; r--) if (mask & (1 << r)) { v = v * 16 + r; k++; }
  while (k < n) { v *= 16; k++; }
  return v;
}
const CAT = 1048576; // 16^5
function eval7(cards, n){
  n = n || cards.length;
  const rc = new Int8Array(13); const sc = new Int8Array(4); const sm = [0,0,0,0];
  let mask = 0;
  for (let i = 0; i < n; i++){ const c = cards[i], r = c >> 2, s = c & 3; rc[r]++; sc[s]++; sm[s] |= 1 << r; mask |= 1 << r; }
  for (let s = 0; s < 4; s++) if (sc[s] >= 5){
    const sh = straightHigh(sm[s]);
    if (sh >= 0) return 8 * CAT + sh;
    return 5 * CAT + topBits(sm[s], 5);
  }
  let quad = -1, trips = [], pairs = [];
  for (let r = 12; r >= 0; r--){ if (rc[r] === 4) quad = r; else if (rc[r] === 3) trips.push(r); else if (rc[r] === 2) pairs.push(r); }
  if (quad >= 0) return 7 * CAT + quad * 16 + topBits(mask & ~(1 << quad), 1);
  if (trips.length && (trips.length > 1 || pairs.length)){
    const t = trips[0]; const p = trips.length > 1 ? Math.max(trips[1], pairs.length ? pairs[0] : -1) : pairs[0];
    return 6 * CAT + t * 16 + p;
  }
  const sh = straightHigh(mask);
  if (sh >= 0) return 4 * CAT + sh;
  if (trips.length){ const t = trips[0]; return 3 * CAT + t * 256 + topBits(mask & ~(1 << t), 2); }
  if (pairs.length >= 2){ const a = pairs[0], b = pairs[1]; return 2 * CAT + a * 256 + b * 16 + topBits(mask & ~(1 << a) & ~(1 << b), 1); }
  if (pairs.length === 1){ const p = pairs[0]; return 1 * CAT + p * 4096 + topBits(mask & ~(1 << p), 3); }
  return topBits(mask, 5);
}

const SFX = (() => {
  let ctx=null, muted=false;
  try { muted = localStorage.getItem('pf_mute')==='1'; } catch(e){}
  function ac(){ if (!ctx){ try{ ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if (ctx && ctx.state==='suspended') ctx.resume(); return ctx; }
  function tone(f, t0, dur, type='sine', vol=.18, slide=0){ const c=ac(); if(!c||muted) return;
    const o=c.createOscillator(), g=c.createGain(); o.type=type; o.frequency.setValueAtTime(f,c.currentTime+t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide), c.currentTime+t0+dur);
    g.gain.setValueAtTime(0.0001,c.currentTime+t0); g.gain.exponentialRampToValueAtTime(vol,c.currentTime+t0+.01);
    g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+t0+dur); o.connect(g).connect(c.destination); o.start(c.currentTime+t0); o.stop(c.currentTime+t0+dur+.02); }
  function noise(t0,dur,vol=.15,freq=2500){ const c=ac(); if(!c||muted) return;
    const b=c.createBuffer(1, Math.max(1,c.sampleRate*dur), c.sampleRate), d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*(1-i/d.length);
    const s=c.createBufferSource(); s.buffer=b; const f=c.createBiquadFilter(); f.type='bandpass'; f.frequency.value=freq; const g=c.createGain(); g.gain.value=vol;
    s.connect(f).connect(g).connect(c.destination); s.start(c.currentTime+t0); }
  return {
    unlock: ac,
    get muted(){return muted}, toggle(){ muted=!muted; try{localStorage.setItem('pf_mute',muted?'1':'0')}catch(e){} return muted; },
    deal(){ noise(0,.06,.25,3000); },
    flip(){ noise(0,.05,.2,1800); tone(900,0,.04,'triangle',.05); },
    chips(){ for(let i=0;i<5;i++) noise(i*.035,.04,.18,4000+i*300); },
    check(){ noise(0,.04,.25,900); noise(.09,.04,.25,900); },
    brilliant(){ [523,659,784,1047,1319].forEach((f,i)=>tone(f,i*.07,.35,'triangle',.16)); tone(2093,.38,.5,'sine',.08); },
    best(){ tone(659,0,.18,'triangle',.16); tone(988,.1,.3,'triangle',.16); },
    good(){ tone(784,0,.22,'triangle',.13); },
    inacc(){ tone(440,0,.2,'square',.06); tone(415,.12,.25,'square',.06); },
    mistake(){ tone(330,0,.25,'sawtooth',.08); tone(262,.15,.35,'sawtooth',.08); },
    blunder(){ tone(220,0,.7,'sawtooth',.14,.35); tone(110,0,.8,'square',.08,.5); noise(0,.25,.2,300); },
    win(){ [392,523,659].forEach((f,i)=>tone(f,i*.08,.25,'triangle',.12)); },
    lose(){ tone(300,0,.4,'triangle',.12,.6); },
  };
})();

const _h1=new Int32Array(7), _h2=new Int32Array(7);
function equityKnown(hc, vc, board){
  const used=new Uint8Array(52); [...hc,...vc,...board].forEach(c=>used[c]=1);
  const rest=[]; for(let c=0;c<52;c++) if(!used[c]) rest.push(c);
  const need=5-board.length; let w=0,n=0;
  _h1[0]=hc[0];_h1[1]=hc[1];_h2[0]=vc[0];_h2[1]=vc[1];
  for(let i=0;i<board.length;i++){_h1[2+i]=_h2[2+i]=board[i];}
  const score=()=>{const x=eval7(_h1,7),y=eval7(_h2,7); w+= x>y?1:x===y?.5:0; n++;};
  if (need===0) score();
  else if (need===1){ for(const a of rest){_h1[6]=_h2[6]=a;score();} }
  else if (need===2){ for(let i=0;i<rest.length;i++)for(let j=i+1;j<rest.length;j++){_h1[5]=_h2[5]=rest[i];_h1[6]=_h2[6]=rest[j];score();} }
  else { for(let k=0;k<5000;k++){ const p=rest; for(let t=0;t<need;t++){ const r=t+rand(p.length-t); [p[t],p[r]]=[p[r],p[t]]; _h1[2+board.length+t]=_h2[2+board.length+t]=p[t]; } score(); } }
  return w/n;
}
function cmpHands(hc,vc,board){ const x=eval7([...hc,...board],7), y=eval7([...vc,...board],7); return x>y?1:x<y?-1:0; }
const CATNAMES=['старшая карта','пара','две пары','сет','стрит','флеш','фулл-хаус','каре','стрит-флеш'];
const catName = cards => CATNAMES[Math.floor(eval7(cards,cards.length)/CAT)];
function sampleFromSet(set, used){ for (let t=0;t<20000;t++){ const a=rand(52), b=rand(52); if (a===b||used[a]||used[b]) continue; if (set[classOf(a,b)]) return [a,b]; } return null; }
function dealClass(cls){
  const r=Math.floor(cls/13), c=cls%13, hi=12-Math.min(r,c), lo=12-Math.max(r,c);
  if (r===c){ const s1=rand(4); let s2=rand(3); if(s2>=s1)s2++; return [hi*4+s1, hi*4+s2]; }
  if (r<c){ const s=rand(4); return [hi*4+s, lo*4+s]; }
  const s1=rand(4); let s2=rand(3); if(s2>=s1)s2++; return [hi*4+s1, lo*4+s2];
}

function genitive(n){ // short soft genitive for common names ("у Валеры", "у Тамары Петровны")

  const [nm,sex,age]=pick(NAMES); const jobs=JOBS.filter(j=>j.ages.includes(age)); const job=pick(jobs.length?jobs:JOBS);

    generated:true, name:nm, short:nm.split(' ')[0], ini:initials(nm), gen:genitive(nm), arch:ak, L, A, job:job.id, prof,
    base:.08+.45*L, shove:.1+.5*(L*.6+A*.4),
    pf:{open:pos.map(p=>Math.min(.85,open*p)), call:.06+.4*L*(1-.4*A), tb:.02+.08*A*(.5+L), c3:.05+.3*L, cai:.04+.2*L},
    pp:{val:.78-.2*A-.05*L, bluff:.02+.25*A, rb:.03+.27*A, base:Math.max(0,.6-.55*L), slope:.4+.5*(1-L), commit:.25-.15*L, raiseT:.95-.1*A, size:.45+.35*A, vf:.85},
    quirks:[],
  };
  // 1–2 habits that make sense for the style
  const qk=Object.keys(QUIRKS).filter(k=>!(k==='river'&&ak==='nit') && !(k==='slow'&&ak==='maniac'));
  shuffle(qk); const nq = Math.random()<.45 ? 2 : 1;
  for (let i=0;i<nq;i++){ b.quirks.push(qk[i]); QUIRKS[qk[i]].apply(b); }
  // phrases: archetype voice + occupation flavour
  const v=VOICE[ak];
  const mix=(...xs)=>xs.filter(Boolean).flat();
  b.bet=mix(v.bet, job.bet, b.quirks.includes('river')?[]:null); b.raise=mix(v.raise); b.call=mix(v.call, job.call); b.fold=mix(v.fold, job.fold);
  b.check=mix(v.check, b.quirks.includes('slow')?QUIRK_LINES.slow.slowLine:null); b.shoveTalk=mix(v.shove); b.win=mix(v.win, job.win); b.lose=mix(v.lose, job.lose); b.idle=mix(v.idle, job.idle);
  b.riverBet = b.quirks.includes('river') ? QUIRK_LINES.river.riverBet : null;
  b.tiltLine = QUIRK_LINES.tilt.tiltLine;
  b.tag = `${prof} · ${a.t.toLowerCase()}`;
  b.styleText = a.d;
  b.tip = tipShortOpen(b); b.tipShove = tipShortShove(b); b.tip2 = tipFull(b);
  return b;
}
function tipShortOpen(b){ return b.base>.3 ? `${b.short} в BB коллирует широко — фолд-эквити мало, пушь руки посильнее, зато сильные пуши он оплатит.` : b.base<.15 ? `${b.short} в BB почти всё сбрасывает — против него пушить можно гораздо шире.` : `${b.short} коллирует пуши примерно по учебнику — ориентируйся на базовые чарты.`; }
function tipShortShove(b){ return b.shove>.4 ? `${b.short} пушит широко — против него можно коллировать заметно шире обычного.` : b.shove<.2 ? `${b.short} пушит только сильные руки — для колла нужна рука ещё сильнее.` : `${b.short} пушит умеренно — решай по шансам банка.`; }
function tipFull(b){
  const t=[];
  if (b.pp.base<.25) t.push(`${b.short} почти не сбрасывает — блефовать бесполезно, зато сильные руки ставь крупно.`);
  else if (b.pp.base>.45) t.push(`${b.short} сбрасывает всё без сильной руки — давить ставками выгодно, а его ставки уважай.`);
  if (b.pp.bluff>.18) t.push(`Он часто блефует — его ставки можно ловить шире.`);
  if (b.quirks.includes('river')) t.push(`На ривере его ставки — часто блеф.`);
  if (b.quirks.includes('slow')) t.push(`Осторожно с его чеками: сильные руки он разыгрывает тихо.`);
  if (b.quirks.includes('scared')) t.push(`Большие ставки его пугают — крупный блеф работает чаще.`);
  return t.length ? t.join(' ') : `${b.short} играет без явных перекосов — решай по шансам банка.`;
}
function tiltBot(b){ b.tilted=true; b.pf.open=b.pf.open.map(x=>Math.min(.9,x+.12)); b.pf.call+=.1; b.pp.bluff+=.12; b.pp.rb+=.1; b.pp.base=Math.max(0,b.pp.base-.08); b.tag=b.tag+' · на тильте'; }
// legends still drop in now and then
function randomOpponent(){ if (Math.random()<.12){ const l=JSON.parse(JSON.stringify(pick(BOTS))); l.legend=true; return l; } return generateBot(); }
function fillT(line, amt){ return (line||'').replace('{amt}', `${num(amt)} BB`); }

function dossierOpen(b){ return LV[CFG.level].showEq || b.revealed || b.legend || b.boss; }
function dossierHtml(b){

// ======================= MODE 1: SHORT STACK =======================
const callPct = (base,E) => clamp(base*Math.pow(10/E,.55), .03, .9);
const shovePct = (bot,V,posIdx,ante) => clamp(bot.shove*Math.pow(10/V,.6)*[.55,.7,.85,1.1,1.3,1.3][posIdx]*(ante?1:.85), .03, .95);
const stackPick = () => pick([3,4,5,6,7,8,8,9,10,10,11,12,12,13,14,15,16,17,18,19,20]);

function makeOpenSpot(ante){
  const heroIdx=pick([0,1,2,2,3,3,3,4,4]), S=stackPick(), bot=randomOpponent();
  const regs=shuffle(REGS.slice()), villains=[];
  for (let p=heroIdx+1;p<6;p++){ const isBB=p===5; villains.push({pos:POS[p], isBB, who:isBB?bot:regs[(p-heroIdx-1)%regs.length], stack:6+rand(40), vPosted:p===4?.5:(isBB?1:0)}); }
  const spot={type:'open', heroIdx, pos:POS[heroIdx], S, bot, heroPosted:heroIdx===4?.5:0, villains, ante};
  spot.callers=[0,1].map(a=>villains.map(v=>{ const avail=v.isBB? v.stack-a : v.stack; const E=Math.min(S,avail); const r=topRange(callPct(v.who.base,E)); return {...v, E, set:r.set, p:r.p}; }));
  spot.evs=[]; for (let c=0;c<169;c++) spot.evs.push(evOpen(spot,c,ante));
  return spot;
}
function evOpen(spot, cls, ante){
  const dead=1.5+(ante?1:0), cs=spot.callers[ante?1:0];
  let pNone=1, ev=0, eqW=0, pCall=0, potW=0, riskW=0;
  for (const v of cs){ const eq=eqVsRange(cls,v.set), pot=2*v.E+dead-spot.heroPosted-v.vPosted, pc=pNone*v.p;
    ev+=pc*(eq*pot-v.E); eqW+=pc*eq; potW+=pc*pot; riskW+=pc*v.E; pCall+=pc; pNone*=(1-v.p); }
  const steal=dead-spot.heroPosted, a=pNone*steal; ev+=a;
  return {go:ev, fold:-spot.heroPosted, pFold:pNone, pCall, eq:pCall?eqW/pCall:.5, partSteal:a, partCall:ev-a, avgPot:pCall?potW/pCall:0, avgRisk:pCall?riskW/pCall:0, steal, dead};
}
function makeCallSpot(ante){
  const heroIdx=pick([5,5,5,4,4,3]); const idxs=[]; for (let i=0;i<heroIdx;i++) for (let k=0;k<=i;k++) idxs.push(i);
  const vIdx=pick(idxs), bot=randomOpponent(), V=4+rand(22), S=stackPick();
  const spot={type:'call', heroIdx, pos:POS[heroIdx], vIdx, vpos:POS[vIdx], S, V, bot, heroPosted:heroIdx===5?1:heroIdx===4?.5:0, vPosted:vIdx===4?.5:0, ante};
  spot.E=Math.min(S,V);
  spot.sets=[0,1].map(a=>topRange(shovePct(bot,V,vIdx,a)));
  spot.evs=[]; for (let c=0;c<169;c++) spot.evs.push(evCall(spot,c,ante));
  return spot;
}
function evCall(spot, cls, ante){
  const dead=1.5+(ante?1:0), r=spot.sets[ante?1:0], eq=eqVsRange(cls,r.set), E=spot.E;
  const pot=2*E+dead-spot.heroPosted-spot.vPosted;
  return {go:eq*pot-E, fold:-spot.heroPosted, eq, pot, need:(E-spot.heroPosted)/pot, cost:E-spot.heroPosted, potNow:dead-spot.vPosted+spot.V, dead, rangeP:r.p};
}
const spotEv = (spot,c,ante) => spot.type==='open' ? evOpen(spot,c,ante) : evCall(spot,c,ante);

function pickHand(spot){
  if (Math.random()<LV[CFG.level].close){
    const cand=[]; let tot=0;
    for (let c=0;c<169;c++){ const e=spot.evs[c]; if (Math.abs(e.go-e.fold)<1.2){ cand.push(c); tot+=COMBOS[c]; } }
    if (cand.length){ let x=Math.random()*tot; let cls=cand[cand.length-1]; for (const c of cand){ x-=COMBOS[c]; if (x<=0){cls=c;break;} } return dealClass(cls); }
  }
  const a=rand(52); let b=rand(51); if(b>=a)b++; return [a,b];
}

function gradeShort(chosen, ev, hint, cls, spot){
  const soft=LV[CFG.level].soft, best=ev.go>=ev.fold?'go':'fold', diff=Math.abs(ev.go-ev.fold), loss=chosen===best?0:diff;
  let g;
  if (loss===0){
    const counter = spot.type==='open' ? (chosen==='go'&&PCT[cls]>.65)||(chosen==='fold'&&PCT[cls]<.12) : (chosen==='go'&&PCT[cls]>.45)||(chosen==='fold'&&PCT[cls]<.06);
    g = (!hint && diff>=.5 && counter) ? 'brilliant' : 'best';
  } else if (loss<.1*soft) g='good'; else if (loss<.35*soft) g='inacc'; else if (loss<1*soft) g='mistake'; else g='blunder';
  return {g, best, diff, loss, acc: loss===0?100:Math.round(100*Math.exp(-loss/(.6*soft)))};
}

function renderSeatsShort(spot, mark){
  const info={};
  if (spot.type==='open'){
    for (let i=0;i<spot.heroIdx;i++) info[i]={label:'пас', cls:'out'};
    for (const v of spot.villains){ if (v.isBB) continue; const i=POS.indexOf(v.pos);
      info[i] = mark===v.pos ? {label:`${v.who.name} · колл`, cls:'call'} : mark ? {label:'пас', cls:'out'} : {label:`${v.who.name} ${v.stack}`, cls:'live'}; }
    renderRing(spot.heroIdx, 5, info);
  } else {
    for (let i=0;i<6;i++) info[i]={label:'пас', cls:'out'};
    renderRing(spot.heroIdx, spot.vIdx, info);
  }
}

function hintShort(spot, ev){
  if (spot.type==='open'){ const bb=spot.callers[spot.ante?1:0].find(v=>v.isBB);
    return `Все сбросят примерно в <b>${pct(ev.pFold)}</b> случаев — это сразу +${num(ev.steal)} BB без вскрытия. Если заколлят, у тебя <b>${pct(ev.eq)}</b> против их рук. ${bb.who.short} в BB коллирует ~${pct(bb.p)} рук. Чем короче стек и позже позиция — тем шире пуш.`; }
  return `Колл стоит ${num(ev.cost)} BB, итоговый банк ${num(ev.pot)} BB — нужно не меньше <b>${pct(ev.need)}</b> шансов. ${spot.bot.short} с ${spot.vpos} пушит ~${pct(ev.rangeP)} рук, у тебя против них <b>${pct(ev.eq)}</b>.`;
}

async function shortHand(){
  hideBanner(); logMsg('');
  const ante=Math.random()<.75, spot=Math.random()<.6 ? makeOpenSpot(ante) : makeCallSpot(ante);
  const hc=pickHand(spot), cls=classOf(hc[0],hc[1]), ev=spot.evs[cls], lv=LV[CFG.level];
  state.hintUsed=false;
  const b=spot.bot;
  renderSeatsShort(spot,null); setBoardSlots(); $('eqbar').classList.remove('on'); $('vCards').innerHTML=''; $('hCards').innerHTML='';
  if (spot.type==='open'){ const bb=spot.villains.find(v=>v.isBB); setOpp(b,'BB'); setStack('v', bb.stack); setBet('v', 0); }
  else { setOpp(b, spot.vpos); setStack('v', 0, true); setBet('v', 0); }
  $('street').textContent = spot.type==='open' ? 'до тебя все сбросили' : `${b.short} идёт олл-ин`;
  setPot(spot.type==='open' ? ev.dead : ev.dead-spot.vPosted);
  const an=$('ante'); an.textContent = ante ? 'АНТЕ 1 BB' : 'БЕЗ АНТЕ'; an.className='ante'+(ante?'':' no'); an.style.display='';
  $('hPos').textContent=spot.pos; setStack('h', spot.S); setBet('h', 0);
  $('hName').innerHTML=`${CNAME[cls]}<small>топ ${Math.max(1,Math.round(PCT[cls]*100))}%</small>`;
  const eqLabel = spot.type==='open' ? 'шансы при колле' : 'шансы vs пуш';
  setHeroEq(eqLabel, null); $('hintbox').classList.remove('on');
  const goHtml = spot.type==='open' ? 'Олл-ин' : `Колл<small>${num(ev.cost)} BB</small>`;
  const btns=[{html:'Фолд', v:'fold', cls:'fold'},{html:goHtml, v:'go', cls:'go'}];
  renderActions(btns, null, ()=>hintShort(spot,ev)); lockActions(); setBusy(true);
  const vc=$('vCards');
  for (let i=0;i<2;i++){ $('hCards').appendChild(cardEl(hc[i],true)); SFX.deal(); await sleep(120); vc.appendChild(cardEl(null,true)); await sleep(80); }
  await sleep(250);
  for (const el of $('hCards').children){ el.classList.remove('down'); SFX.flip(); await sleep(110); }
  if (spot.type==='call'){ setBet('v', spot.V, 'олл-ин'); say(fillT(pick(b.shoveTalk),spot.V), 2200); SFX.chips(); }
  setHeroEq(eqLabel, ev.eq, lv.showEq);
  renderActions(btns, null, ()=>hintShort(spot,ev));
  setBusy(false);
  const idleT=setTimeout(()=>{ if(state.pending && spot.type==='open') say(pick(b.idle)); }, 4000);
  const action = await waitAction(); clearTimeout(idleT);
  if (action==='__abort') throw ABORT;
  setBusy(true); lockActions();
  const gr=gradeShort(action, ev, state.hintUsed, cls, spot);
  miniBadge(gr.g); setHeroEq(eqLabel, ev.eq, true);
  const result = spot.type==='open' ? await resolveOpen(spot, hc, action) : await resolveCall(spot, hc, action);
  setBusy(false);
  return {mode:'short', spot, hc, cls, ev, action, hint:state.hintUsed, ...gr, result, bb:result.bb, label:CNAME[cls]};
}

async function runout(hc, vc, deck, vname, board=[]){
  $('eqbar').classList.add('on'); setEqBar(equityKnown(hc,vc,board), vname); await sleep(1000);
  for (const [nm,n] of [['флоп',3],['тёрн',1],['ривер',1]]){
    if (board.length>=(nm==='флоп'?3:nm==='тёрн'?4:5)) continue;
    $('street').textContent=nm;
    for (let i=0;i<n;i++){ const c=deck.pop(); placeBoardCard(board.length,c); board.push(c); SFX.deal(); await sleep(170); }
    const eq=equityKnown(hc,vc,board); setEqBar(eq, vname);
    await sleep(nm==='ривер'?600:(eq>.15&&eq<.85?1300:900));
  }
  return board;
}
function freshDeck(excl){ const u=new Uint8Array(52); excl.forEach(c=>u[c]=1); const d=[]; for(let c=0;c<52;c++) if(!u[c]) d.push(c); return shuffle(d); }

async function resolveOpen(spot, hc, action){
  const ante=spot.ante, cs=spot.callers[ante?1:0], deck=freshDeck(hc), bbv=cs.find(v=>v.isBB);
  let caller=null;
  for (const v of cs){ v.cards=[deck.pop(),deck.pop()]; if (v.set[classOf(v.cards[0],v.cards[1])]){ caller=v; break; } }
  const dead=1.5+(ante?1:0); const res={bb:0, outcome:'fold'};
  if (action==='fold'){
    $('hCards').querySelectorAll('.card').forEach(c=>c.classList.add('dim')); banner('Пас','var(--ink)'); SFX.deal();
    res.bb=-spot.heroPosted;
    res.would = caller ? `Если бы пошёл олл-ин — ${caller.isBB?caller.who.name:caller.who.name+' ('+caller.pos+')'} заколлил бы с ${cardTxt(caller.cards[0])}${cardTxt(caller.cards[1])}.` : 'Если бы пошёл олл-ин — все бы сбросили.';
    if (bbv) say(caller&&caller.isBB ? 'Эх, а я бы заколлил…' : pick(bbv.who.fold));
    await sleep(1000); return res;
  }
  SFX.chips(); setStack('h',0,true); setBet('h', spot.S-spot.heroPosted+ (spot.heroPosted?spot.heroPosted:0), 'олл-ин');
  banner('Олл-ин','var(--accent)'); await sleep(700); hideBanner();
  if (!caller){
    renderSeatsShort(spot,'none'); if (bbv) say(pick(bbv.who.fold)); await sleep(800);
    setBet('h',0); setPot(dead+spot.S-spot.heroPosted);
    banner('Все сбросили — банк твой','var(--accent)'); SFX.win(); res.bb=dead-spot.heroPosted; res.outcome='steal'; await sleep(1100); return res;
  }
  renderSeatsShort(spot, caller.pos);
  if (!caller.isBB){ setOpp(caller.who, caller.pos, 'заколлил твой олл-ин'); setStack('v', caller.stack-caller.E); }
  else setStack('v', caller.stack-caller.E-(ante?1:0));
  say(fillT(pick(caller.isBB?caller.who.call:['Колл.','Заколлю, пожалуй','Плачу']),caller.E), 2200);
  SFX.chips(); setBet('v', caller.E, 'колл');
  const pot=2*caller.E+dead-spot.heroPosted-caller.vPosted;
  await sleep(600); setBet('v',0); setBet('h',0); setPot(pot);
  const vcEl=$('vCards'); vcEl.innerHTML='';
  const vEls=caller.cards.map(c=>{const e=cardEl(c,true,false); vcEl.appendChild(e); return e;});
  await sleep(400); for(const e of vEls){ e.classList.remove('down'); SFX.flip(); await sleep(150); }
  const board=await runout(hc, caller.cards, deck, caller.who.short||caller.who.name);
  return finishShowdown(res, hc, caller.cards, board, pot, caller.E, vEls, caller.isBB?caller.who:null);
}
async function finishShowdown(res, hc, vc, board, pot, risk, vEls, who){
  const r=cmpHands(hc,vc,board);
  res.bb = r>0 ? pot-risk : r===0 ? pot/2-risk : -risk; res.outcome = r>0?'win':r<0?'lose':'split'; res.board=board; res.vc=vc;
  if (r>0){ banner(`Выиграл · ${catName([...hc,...board])}`,'var(--accent)'); SFX.win(); $('hCards').querySelectorAll('.card').forEach(c=>c.classList.add('win')); if (who) say(pick(who.lose)); }
  else if (r<0){ banner(`Проиграл · ${catName([...vc,...board])}`,'var(--bad)'); SFX.lose(); vEls.forEach(c=>c.classList.add('win')); if (who) say(pick(who.win)); }
  else banner('Делёж банка','var(--ink)');
  await sleep(1500); return res;
}
async function resolveCall(spot, hc, action){
  const ante=spot.ante, set=spot.sets[ante?1:0].set, used=new Uint8Array(52); used[hc[0]]=used[hc[1]]=1;
  const vc=sampleFromSet(set, used) || [0,1];
  const deck=freshDeck([...hc,...vc]); const dead=1.5+(ante?1:0);
  const vcEl=$('vCards'); vcEl.innerHTML=''; const vEls=vc.map(c=>{const e=cardEl(c,true,false); vcEl.appendChild(e); return e;});
  const res={bb:0, outcome:'fold'};
  if (action==='fold'){
    $('hCards').querySelectorAll('.card').forEach(c=>c.classList.add('dim')); banner('Пас','var(--ink)'); SFX.deal();
    res.bb=-spot.heroPosted; await sleep(700); hideBanner();
    for(const e of vEls){ e.classList.remove('down'); SFX.flip(); await sleep(150); }
    const board=[]; while(board.length<5) board.push(deck.pop());
    const r=cmpHands(hc,vc,board);
    res.would = `У ${spot.bot.gen} было ${cardTxt(vc[0])}${cardTxt(vc[1])}. Если бы заколлил — ${r>0?'выиграл бы':r<0?'проиграл бы':'поделили бы банк'} (борд ${board.map(cardTxt).join(' ')}).`;
    say(r>0?'Фух, повезло мне…':pick(spot.bot.win)); await sleep(1300); return res;
  }
  SFX.chips(); setStack('h', spot.S-spot.E, spot.S<=spot.E); setBet('h', spot.E, 'колл'); banner('Колл','var(--accent)');
  const pot=2*spot.E+dead-spot.heroPosted-spot.vPosted;
  await sleep(700); hideBanner(); say(pick(spot.bot.call),1800);
  setBet('h',0); setBet('v',0); setPot(pot);
  for(const e of vEls){ e.classList.remove('down'); SFX.flip(); await sleep(150); }
  const board=await runout(hc, vc, deck, spot.bot.short);
  return finishShowdown(res, hc, vc, board, pot, spot.E, vEls, spot.bot);
}

// ---------- review: 3 layers ----------
function memeShort(rec){
  const good=rec.loss===0||rec.g==='good', o=rec.result.outcome;
  if (o==='steal') return good ? 'Все сбросили. Банк твой — и решение верное.' : 'Все сбросили… но повезло. В долгую такой пуш теряет.';
  if (o==='fold') return rec.result.would;

function pfRule(bot, ctx, c, botIdx, potOddsGood, depth){

// --- strengths of all combos on a board (percentile + draws), and hero equity vs each combo ---
const _t=new Int32Array(7);
function strengths(board){
  const S=new Float32Array(1326), vals=new Float64Array(1326), bu=new Uint8Array(52); board.forEach(c=>bu[c]=1);
  const arr=[]; const n=2+board.length;
  for (let i=0;i<1326;i++){ const [a,b]=CMB[i]; if (bu[a]||bu[b]){ vals[i]=-1; continue; }
    _t[0]=a;_t[1]=b; for(let k=0;k<board.length;k++)_t[2+k]=board[k]; vals[i]=eval7(_t,n); arr.push(vals[i]); }
  arr.sort((x,y)=>x-y);
  const lb=v=>{ let lo=0,hi=arr.length; while(lo<hi){const m=(lo+hi)>>1; if(arr[m]<v)lo=m+1; else hi=m;} return lo; };
  const ub=v=>{ let lo=0,hi=arr.length; while(lo<hi){const m=(lo+hi)>>1; if(arr[m]<=v)lo=m+1; else hi=m;} return lo; };
  for (let i=0;i<1326;i++){ if (vals[i]<0) continue; let s=(lb(vals[i])+ub(vals[i]))/2/arr.length;
    if (board.length<5){ const [a,b]=CMB[i]; const sc=[0,0,0,0]; let mask=0; for (const c of [a,b,...board]){ sc[c&3]++; mask|=1<<(c>>2); }
      const cat=Math.floor(vals[i]/CAT);
      if (cat<5){ for (let su=0;su<4;su++) if (sc[su]===4 && ((a&3)===su||(b&3)===su)) s+= board.length===3?.15:.08;
        const m=((mask<<1)|((mask>>12)&1)); let w=0; for (let st=0;st<=9;st++){ let cnt=0; for(let k=0;k<5;k++) if(m&(1<<(st+k))) cnt++; if(cnt===4) w++; }
        if (cat<4) s += w>=2 ? (board.length===3?.1:.05) : w===1 ? (board.length===3?.04:.02) : 0; } }
    S[i]=Math.min(1,s); }
  return S;
}
function heroEqs(hc, board){
  const E=new Float32Array(1326);
  if (board.length===0){ const hcls=classOf(hc[0],hc[1]); for (let i=0;i<1326;i++) E[i]=eqAt(hcls,CMB_CLS[i]); return E; }
  const used=new Uint8Array(52); [...hc,...board].forEach(c=>used[c]=1);
  const rest=[]; for (let c=0;c<52;c++) if(!used[c]) rest.push(c);
  let runs=[];
  if (board.length===5) runs=[[]];
  else if (board.length===4) runs=rest.map(c=>[c]);
  else { for (let k=0;k<240;k++){ const i=rand(rest.length); let j=rand(rest.length-1); if(j>=i)j++; runs.push([rest[i],rest[j]]); } }
  const hv=runs.map(r=>eval7([...hc,...board,...r],7));
  const bl=board.length;
  for (let i=0;i<1326;i++){ const [a,b]=CMB[i]; if (used[a]||used[b]) continue; let w=0,n=0;
    _t[0]=a;_t[1]=b; for(let k=0;k<bl;k++)_t[2+k]=board[k];
    for (let k=0;k<runs.length;k++){ const r=runs[k]; if (r.length && (r[0]===a||r[0]===b||(r.length>1&&(r[1]===a||r[1]===b)))) continue;
      for (let q=0;q<r.length;q++) _t[2+bl+q]=r[q]; const v=eval7(_t,7); w+= hv[k]>v?1:hv[k]===v?.5:0; n++; }
    E[i]=n?w/n:.5; }
  return E;
}

async function playStreet(){
  H.acted={h:false,b:false};
  let actor = H.street===0 ? (H.heroIdx<H.botIdx?'h':'b') : (POST_ORDER(H.heroIdx)<POST_ORDER(H.botIdx)?'h':'b');
  // if someone is already all-in before the street, skip betting
  if (H.hs===0 || H.bs===0) return 'allin';
  for (let guard=0; guard<12; guard++){
    const r = actor==='h' ? await heroAct() : await botAct();
    fullRender();
    if (r==='fold'){ H.folded=actor; return 'fold'; }
    H.acted[actor]=true;
    refundExcess(); fullRender();
    if (Math.abs(H.hi-H.bi)<1e-9 && (H.hs===0 || H.bs===0) && H.acted.h && H.acted.b) return 'allin';
    if (Math.abs(H.hi-H.bi)<1e-9 && H.acted.h && H.acted.b) return 'next';
    if (Math.abs(H.hi-H.bi)<1e-9 && (H.hs===0 || H.bs===0)) return 'allin';
    actor = actor==='h'?'b':'h';
  }
  return 'next';
}

// ---------- hero options & EV ----------
function heroOptions(){

      opts.push({kind:'fold', label:'Фолд'});
      const o=openSize(H.heroIdx); addAggr(`Рейз ${num(o)}`, o, 'raise', `Рейз`); addAggr(`Рейз ${num(o+1)}`, o+1, 'raise', 'Рейз'); addAggr('Олл-ин', H.hi+H.hs, 'allin');
    } else {

    for (const [f,l] of [[1/3,'⅓'],[.5,'½'],[.75,'¾'],[1,'Банк']]) addAggr(`Ставка ${l}`, r1(Math.max(1,f*P)), 'bet', l);
    addAggr('Олл-ин', H.hi+H.hs, 'allin');

    opts.push({kind:'fold', label:'Фолд'}); opts.push({kind:'call', label:`Колл ${num(Math.min(toCall,H.hs))}`, c:Math.min(toCall,H.hs)});

function evalOptions(opts){

  let eqR=0; for (let i=0;i<1326;i++) if (w[i]>0) eqR+=w[i]*E[i];

  const Fp=[.15,.3,.2,0][H.street], Fm=[.05,.08,.05,0][H.street];
  const fut = (eq, rem) => (eq-.5)*(eq>.5?Fp:Fm)*Math.max(0,rem);
  for (const o of opts){

    if (o.kind==='call'){ const c=o.c, Peff=P-(toCall-c), allin=c>=H.hs-1e-9 || H.bs===0; const RR = (H.street===0 && !allin) ? R : 1;

      continue; }
    // aggressive: bet / raise / allin to street total X
    const X=o.X, add=r1(X-H.hi), botNeed=r1(X-H.bi), botCall=Math.min(botNeed,H.bs), addEff=r1(H.bi+botCall-H.hi);

function memeFull(rec){
  const good=rec.acc>=85, o=rec.outcome;
  if (o==='steal') return good?'Соперник сдался — и сыграно чисто.':'Соперник сбросил… но местами повезло.';
  if (o==='fold') return good?'Вовремя сбросил — это тоже победа.':'Сбросил, но где-то раньше уже потерял.';
  if (o==='split') return 'Поделили банк.';
  if (good && o==='lose') return 'Сыграл почти идеально — и проиграл. Это покер.';
  if (good && o==='win') return 'Чисто и прибыльно. Красота.';
  if (!good && o==='win') return 'Ошибки были, но затащил. Удача — не стратегия.';

// ======================= SEEDED RANDOM (for duels) =======================
const NATIVE_RANDOM = Math.random;
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function seedHand(seed, i){ Math.random = mulberry32((seed ^ Math.imul(i+1, 0x9E3779B1))>>>0); }
function unseed(){ Math.random = NATIVE_RANDOM; }

// ======================= DUEL CODE =======================
const ALPH='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function encodeDuel(seed, acc, lvl){
  let v = BigInt(seed>>>0 & 0x1FFFFFFF) | (BigInt(acc&127)<<29n) | (BigInt(lvl&1)<<36n);
  const chk = (v*2654435761n) % 8n; v |= chk<<37n;
  let s=''; for (let i=0;i<8;i++){ s=ALPH[Number(v & 31n)]+s; v>>=5n; }
  return s.slice(0,4)+'-'+s.slice(4);
}
function decodeDuel(code){
  const s=(code||'').toUpperCase().replace(/[^A-Z0-9]/g,'').replace(/O/g,'0').replace(/I/g,'1');
  if (s.length!==8) return null;
  let v=0n; for (const ch of s){ const k=ALPH.indexOf(ch); if (k<0) return null; v=(v<<5n)|BigInt(k); }
  const chk=(v>>37n)&7n, body=v & ((1n<<37n)-1n);
  if ((body*2654435761n)%8n!==chk) return null;
  return {seed:Number(body & 0x1FFFFFFFn), acc:Number((body>>29n)&127n), lvl:Number((body>>36n)&1n)};
}

async function runDuel(challenge){
  const seed = challenge ? challenge.seed : (Math.floor(NATIVE_RANDOM()*0x1FFFFFFF)>>>0);
  if (challenge) CFG.level = challenge.lvl ? 'pro' : 'novice';
  const recs = await runSeries({mode:'short', len:10, seed, label: challenge?'Дуэль: ответ на вызов':'Дуэль: твой вызов'});
  if (!recs) return;
  const acc=Math.round(recs.reduce((a,r)=>a+r.acc,0)/recs.length);
  const code=encodeDuel(seed, acc, CFG.level==='pro'?1:0);
  const R=$('result'); let html;
  if (challenge){
    const me=acc, him=challenge.acc, mood = me>him?'happy':me<him?'sad':'think';
    const verdict = me>him ? 'Победа! Ты решил точнее.' : me<him ? 'Поражение. Друг решил точнее.' : 'Ничья — точность одинаковая.';
    state.share=`Дуэль в «Пуш или Фолд»: я — ${me}%, ты — ${him}%. ${me>him?'Я выиграл 😎':me<him?'Ты выиграл, реванш?':'Ничья!'} Код дуэли: ${code}`;
    html=`<div class="card2" style="text-align:center"><div class="lbl">Дуэль · одинаковые 10 раздач</div>
      <div style="display:flex;justify-content:center;margin:10px 0">${mascotSvg(mood,96)}</div>
      <div class="vs"><div><div class="who">ТЫ</div><div class="n">${me}%</div></div><div class="x">vs</div><div><div class="who">ДРУГ</div><div class="n">${him}%</div></div></div>
      <div class="vt" style="font-size:20px;font-weight:800;margin-top:12px">${verdict}</div>
      <div class="verdict2" style="margin-top:6px">Сравнивается точность решений, а не выигранные фишки — удача тут не помогает.</div></div>`;
  } else {
    state.share=`Вызываю тебя на дуэль в «Пуш или Фолд»! Открой игру → «Дуэль» → «Принять вызов» и введи код ${code}. Мой результат — ${acc}%. Сможешь лучше?`;
    html=`<div class="card2" style="text-align:center"><div class="lbl">Дуэль · твой результат</div>
      <div style="display:flex;justify-content:center;margin:10px 0">${mascotSvg(acc>=80?'happy':acc>=55?'think':'sad',96)}</div>
      <div class="bignum">${acc}%</div>
      <div class="verdict2" style="margin:8px 0 14px">Отправь другу код. Он получит те же 10 раздач, и вы сравните точность.</div>
      <div class="codebox">${code}</div></div>`;
  }
  html+=`<button class="big-btn" id="rCopy">${challenge?'Скопировать результат':'Скопировать вызов для друга'}</button>
    <div class="row"><button class="ghost-btn" id="rReview">Разбор раздач</button><button class="ghost-btn" id="rMenu">В меню</button></div>`;
  R.innerHTML=html; show('result');
  $('rCopy').onclick=async()=>{ try{ await navigator.clipboard.writeText(state.share); toast('Скопировано — отправь другу'); }catch(e){ toast('Не удалось скопировать. Код: '+code); } };
  $('rReview').onclick=()=>{ showSummary(true); };
  $('rMenu').onclick=()=>{ show('start'); renderStart(); };
}

const BLINDS=[1,1.5,2];
// bots get sharper with depth: fold less to pressure, defend more preflop
function sharpen(b, depth, aggro){
  b=JSON.parse(JSON.stringify(b));
  b.pp.commit*=.6; b.pp.base=Math.max(0,b.pp.base-.04*depth); b.pp.slope=Math.max(.3,b.pp.slope-.08*depth);
  b.pp.bluff=b.pp.bluff+(.15-b.pp.bluff)*.4*depth/2; b.pp.rb=b.pp.rb+(.2-b.pp.rb)*.4*depth/2;
  b.pf.call+=.05*depth; b.pf.tb+=.02*depth; b.pf.c3+=.05*(depth+1); b.pf.cai+=.03*(depth+1);
  if (aggro){ b.pp.bluff*=1.2; b.pp.rb*=1.2; b.pp.raiseT-=.03; b.pp.val-=.03; b.pf.tb*=1.2; b.pf.open=Array.isArray(b.pf.open)?b.pf.open.map(x=>x*1.2):b.pf.open*1.2; }
  return b;
}
const isvg = p => `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
function bossOf(depth){
  const clone=b=>JSON.parse(JSON.stringify(b));
  if (depth===0){ const b=clone(BOTS[2]); b.boss=true; b.tag='босс · блефует на каждом ривере'; b.pp.rb=.6; b.pf.call+=.08; return b; }
  if (depth===1){ const b=clone(BOTS[0]); b.boss=true; b.tag='босс · почти никогда не сбрасывает'; b.pp.base=0; b.pp.slope=.3; b.pp.commit=.05; return b; }
  return clone(MEGALODON);
}
function aquaBest(){ try{ return JSON.parse(localStorage.getItem('pf_aqua_best')||'null'); }catch(e){ return null; } }
function saveAquaBest(table, stack){ const b=aquaBest(); if (!b || table>b.table || (table===b.table && stack>b.stack)){ try{ localStorage.setItem('pf_aqua_best', JSON.stringify({table, stack:r1(stack)})); }catch(e){} return true; } return false; }

let RUN=null;
function newRun(){
  const tables=[];
  for (let d=0;d<3;d++){ for (let k=0;k<2;k++){ tables.push({bot:randomOpponent(), boss:false, depth:d}); } tables.push({bot:bossOf(d), boss:true, depth:d}); }
  RUN={stack:30, table:0, tables, perks:{}, buoyUsed:false, aggroNext:false};

}

function hubHtml(title, sub){

      <div class="lbl" style="margin:14px 0 6px">Улучшения</div><div class="perks">${perks}</div></div>`;
}
function oppPreview(t){ return `<div class="card2" style="display:flex;align-items:center;gap:14px"><div class="ava ${t.boss?'boss':''}">${t.bot.ini}</div><div><div style="font-weight:800">${t.boss?'Босс: ':''}${t.bot.name}</div><div class="levdesc">${t.bot.tag}</div></div></div>`; }
function waitClick(id){ return new Promise(r=>{ $(id).onclick=()=>r(); }); }

async function runAqua(){
  SFX.unlock(); newRun();
  try {
    const A=$('aqua');
    A.innerHTML = hubHtml('Погружение', '9 столов на трёх глубинах, начинаешь с 30 BB. Стек переносится, глубже блайнды растут, а соперники умнеют. Боссов проходишь только с точностью от 70%, улучшения — только за боссов. Проиграешь стек — тебя съели.') + oppPreview(RUN.tables[0]) + `<button class="big-btn" id="aGo">Нырнуть</button><button class="ghost-btn" id="aMenu">В меню</button>`;
    show('aqua'); $('aMenu').onclick=()=>{ RUN=null; state.running=false; show('start'); renderStart(); };
    await waitClick('aGo');
    while (RUN && RUN.table<9){
      const t=RUN.tables[RUN.table], mul=BLINDS[t.depth];
      const bot = sharpen(t.bot, t.depth, RUN.aggroNext); RUN.aggroNext=false;

      for (let h=0; h<2; h++){
        state.topText=`${DEPTHS[t.depth]} · стол ${RUN.table+1}/9${t.boss?' · босс':''} · раздача ${h+1}/2`; state.hintUsed=false;
        if (RUN.perks.sonar) state.hintsLeft=0;
        show('game'); renderDots();
        const rec = await fullHand({bot, heroStack:RUN.stack, botStack: t.boss?50:30+rand(21), xray:!!RUN.perks.xray && h===0, sonar:!!RUN.perks.sonar, blindMul:mul});
        RUN.stack = rec.heroEnd;
        if (RUN.perks.nose){ const good=rec.decisions.filter(d=>d.g==='best'||d.g==='brilliant').length, bad=rec.decisions.filter(d=>d.g==='blunder').length;
          const delta=good-2*bad; if (delta){ RUN.stack=r1(Math.max(0,RUN.stack+delta)); rec.bonus=delta; } }
        state.results.push(rec); tableRecs.push(rec);
        if (bot.tilt && !bot.tilted && rec.bb>0 && h===0){ tiltBot(bot); setTimeout(()=>toast(`${bot.short} затильтовал — будет играть шире и злее`),400); }
        const r = await openReview(rec, 'Дальше');
        if (r==='__abort') throw ABORT;
        if (RUN.stack < 1){
          if (RUN.perks.buoy && !RUN.buoyUsed){ RUN.buoyUsed=true; RUN.stack=8; toast('Спасательный круг: +8 BB'); }
          else return aquaEnd(false);
        }
      }
      RUN.table++;
      let headline, line;
      if (t.boss){
        const accT = Math.round(tableRecs.reduce((a,r)=>a+r.acc,0)/tableRecs.length);
        if (accT>=70){ RUN.stack=r1(RUN.stack+10); headline='Босс повержен!'; line=`Точность за стол ${accT}% — награда +10 BB. Теперь ${num(RUN.stack)} BB.`; }
        else { RUN.stack=r1(Math.max(0,RUN.stack-10)); headline='Босс откусил кусок'; line=`Точность за стол ${accT}% — нужно было от 70%. Минус 10 BB, осталось ${num(RUN.stack)} BB.`; }
        if (RUN.stack < 1){ if (RUN.perks.buoy && !RUN.buoyUsed){ RUN.buoyUsed=true; RUN.stack=8; toast('Спасательный круг: +8 BB'); } else { RUN.table--; return aquaEnd(false); } }
      }
      saveAquaBest(RUN.table, RUN.stack);

      if (t.boss){
        // perk choice only after a boss
        const avail=Object.keys(PERKS).filter(k=>(!RUN.perks[k] || k==='pearl') && !(k==='hints'&&RUN.perks.sonar) && !(k==='sonar'&&RUN.perks.hints)); shuffle(avail); const offer=avail.slice(0,3);
        A.innerHTML=`<div class="card2" style="text-align:center"><div style="display:flex;justify-content:center">${mascotSvg(headline==='Босс повержен!'?'happy':'think',90)}</div>
          <div style="font-size:22px;font-weight:800;margin-top:6px">${headline}</div><div class="verdict2">${line}</div></div>
          <div class="lbl">Выбери улучшение — следующее будет только после следующего босса</div><div class="pick">${offer.map(k=>`<button class="pickc" data-k="${k}"><div class="pi">${isvg(PERKS[k].i)}</div><div><div class="pt">${PERKS[k].t}</div><div class="pd">${PERKS[k].d}</div></div></button>`).join('')}</div>`;
        show('aqua');
        const k = await new Promise(res=>A.querySelectorAll('.pickc').forEach(b=>b.onclick=()=>res(b.dataset.k)));
        if (k==='pearl'){ RUN.stack=r1(RUN.stack+8); RUN.aggroNext=true; } else RUN.perks[k]=true;

                         : nt.boss ? 'Стол пройден. Впереди босс: чтобы пройти его без потерь, нужна точность от 70%.' : 'Стол пройден. Следующий соперник уже за столом.';
      A.innerHTML = hubHtml(`${DEPTHS[nt.depth]} · стол ${RUN.table+1}`, sub) + oppPreview(nt) + `<button class="big-btn" id="aGo">За стол</button><button class="ghost-btn" id="aMenu">Сдаться и выйти</button>`;
      show('aqua');

  show('aqua'); if (win) confetti();
  $('aAgain').onclick=()=>runAqua();
  $('aRev').onclick=()=>showSummary(true);
  $('aCopy').onclick=async()=>{ try{ await navigator.clipboard.writeText(state.share); toast('Скопировано'); }catch(e){ toast('Не удалось скопировать'); } };
  $('aMenu2').onclick=()=>{ show('start'); renderStart(); };
  RUN=null;
}

// ======================= START SCREEN =======================
const MODE_LIST=[
  {id:'short', t:'Короткий стек', d:'3–20 BB. Олл-ин, колл или фолд. Точная математика.', i:'<path d="M13 2.5L5 13.5h6l-1 8 8-11h-6z"/>'},
  {id:'full', t:'Полная раздача', d:'25–60 BB. От префлопа до ривера, разбор каждого хода.', i:'<rect x="3.5" y="5" width="10" height="14" rx="2" transform="rotate(-8 8.5 12)"/><rect x="10.5" y="4.5" width="10" height="14" rx="2" transform="rotate(8 15.5 11.5)"/>'},
  {id:'aqua', t:'Аквариум', d:'Забег через 9 столов и 3 босса. Стек переносится, проиграл — съели.', i:'<path d="M3 12c3-5 11-5 14 0-3 5-11 5-14 0z"/><path d="M17 12l4-3.4v6.8z"/><path d="M7.5 11h.01"/>', isNew:true},
  {id:'duel', t:'Дуэль', d:'10 одинаковых раздач тебе и другу. Кто решит точнее.', i:'<path d="M5 19L15 9M9 5l10 10"/><path d="M14 4l6 6M4 14l6 6"/>', isNew:true},
];
function applyTheme(){ document.documentElement.dataset.theme=CFG.theme||'light'; $('btnTheme').innerHTML=(CFG.theme==='dark'?'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg> Светлая тема':'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg> Тёмная тема'); }
function renderStart(){
  if (!CFG.len.duel) CFG.len.duel=10;
  $('mascotTop').innerHTML=mascotSvg('happy',56);
  $('modes').innerHTML=MODE_LIST.map(m=>`<button class="mode${CFG.mode===m.id?' on':''}" data-mode="${m.id}">${m.isNew?'<span class="new">НОВОЕ</span>':''}<div class="mi">${isvg(m.i)}</div><div class="mt">${m.t}</div><div class="md">${m.d}</div></button>`).join('');
  document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{ CFG.mode=b.dataset.mode; saveCfg(); renderStart(); });
  document.querySelectorAll('#segLevel button').forEach(b=>b.classList.toggle('on', b.dataset.v===CFG.level));
  $('levDesc').textContent=LV[CFG.level].desc;
  const hasLen = CFG.mode==='short'||CFG.mode==='full';
  $('lenRow').style.display = hasLen?'':'none';
  $('duelRow').style.display = CFG.mode==='duel'?'':'none';
  $('aquaInfo').style.display = CFG.mode==='aqua'?'':'none';
  if (CFG.mode==='aqua'){ const b=aquaBest(); $('aquaInfo').textContent = b ? `Твой рекорд: ${b.table} из 9 столов.` : 'Ты ещё не нырял. Начни с 30 BB и посмотри, как глубоко получится зайти.'; }
  if (hasLen){ const sl=$('segLen'); sl.innerHTML='';
    for (const n of LENS[CFG.mode]){ const b=document.createElement('button'); b.textContent=n; b.classList.toggle('on', CFG.len[CFG.mode]===n); b.onclick=()=>{ CFG.len[CFG.mode]=n; saveCfg(); renderStart(); }; sl.appendChild(b); } }
  $('btnStart').textContent = CFG.mode==='duel' ? 'Создать вызов' : CFG.mode==='aqua' ? 'Начать забег' : 'Играть';
  applyTheme();
}
document.querySelectorAll('#segLevel button').forEach(b=>b.onclick=()=>{ CFG.level=b.dataset.v; saveCfg(); renderStart(); });

// ======================= SERIES =======================
// plays a series of hands; returns the records, or null if aborted
async function runSeries(o){
  SFX.unlock(); closeSheet();
  state.results=[]; state.idx=0; state.hintsLeft=LV[CFG.level].hints; state.running=true; state.topText=null; state.dotsLen=o.len; state.seriesMode=o.mode;
  show('game');
  try {
    for (let i=0;i<o.len;i++){
      state.idx=i; renderDots();
      if (o.seed!=null) seedHand(o.seed, i);
      const rec = o.mode==='short' ? await shortHand() : await fullHand({});
      unseed();
      state.results.push(rec); renderDots();
      const r = await openReview(rec, i===o.len-1 ? 'Итоги →' : 'Следующая раздача →');
      if (r==='__abort') throw ABORT;
    }
    state.running=false; state.dotsLen=null; return state.results;
  } catch(e){ unseed(); state.running=false; state.dotsLen=null; if (e!==ABORT){ console.error(e); toast('Ошибка: '+e.message); } return null; }
}
function openReview(rec, btnText, quiet){
  { const ob = rec.mode==='short' ? rec.spot.bot : rec.bot; if (ob) ob.revealed=true; }
  if (rec.mode==='short'){
    const p=openSheet(reviewShortHtml(rec), btnText, root=>wireShortReview(root,rec));
    if (!quiet) gradeEffects(rec.g); return p;
  }
  const p=openSheet(reviewFullHtml(rec)+(rec.bonus?`<div class="result">Акулий нюх: <b>${fmt(rec.bonus)} BB</b></div>`:''), btnText, root=>wireFullReview(root,rec));
  if (rec.g==='brilliant' && !quiet) confetti(); return p;
}
async function startSelected(){
  if (state.running) return;
  if (CFG.mode==='aqua') return runAqua();
  if (CFG.mode==='duel') return runDuel(null);
  const recs = await runSeries({mode:CFG.mode, len:CFG.len[CFG.mode]});
  if (recs) showSummary();
}

function showSummary(back){
  closeSheet(); show('summary');
  const R=state.results; if (!R.length){ show('start'); return; }
  const acc=Math.round(R.reduce((a,r)=>a+r.acc,0)/R.length), bb=R.reduce((a,r)=>a+r.bb,0);
  $('sAcc').textContent=acc+'%';
  $('sMascot').innerHTML=mascotSvg(acc>=85?'happy':acc>=60?'think':'sad',84);
  const cnt={}; GORDER.forEach(k=>cnt[k]=0);
  R.forEach(r=>{ if (r.mode==='short') cnt[r.g]++; else r.decisions.forEach(d=>cnt[d.g]++); });
  $('sCounts').innerHTML=GORDER.map(k=>`<div class="cnt">${badgeHtml(k)}${GRADES[k].label}<b>${cnt[k]}</b></div>`).join('');
  const v = acc>=95?'Мегалодон. Студент Паша нервно пересчитывает таблицы.' : acc>=85?'Акула. Артём одобрительно кивает.' : acc>=70?'Щука. Неплохо, но Дядя Слава уже потирает руки.' : 'Карась. Бабушка Зина предлагает покушать и попробовать ещё раз.';
  $('sVerdict').textContent=v;
  $('sBB').textContent=`По фишкам: ${fmt(bb)} BB — но считается точность, а не карты.`;
  if (!back) state.share=`«Пуш или Фолд»: точность ${acc}% — ${v.split('.')[0]}. Сможешь лучше?`;
  const h=$('sHist'); h.innerHTML='';
  R.forEach((r,i)=>{ const b=document.createElement('button'); b.className='hitem'; let mid;
    if (r.mode==='short'){ const sp=r.spot; mid=`<div class="mid">${CNAME[r.cls]} · ${sp.S} BB · ${sp.pos}<small>${sp.type==='open'?'ты первый':'против пуша: '+sp.bot.short}${sp.ante?'':' · без анте'} · ${r.action==='go'?(sp.type==='open'?'олл-ин':'колл'):'фолд'}</small></div>`; }
    else mid=`<div class="mid">${cardsHtml(r.hc)} · ${r.heroPos} против ${r.bot.short}<small><span class="mb">${r.decisions.map(d=>badgeHtml(d.g)).join('')}</span> точность ${r.acc}%</small></div>`;
    b.innerHTML=`<span class="n">${i+1}</span>${badgeHtml(r.g)}${mid}<span class="r">${fmt(r.bb)}</span>`;
    b.onclick=()=>openReview(r,'Закрыть',true); h.appendChild(b); });
  $('btnAgain').textContent = back ? 'Назад' : 'Ещё серия';
  $('btnAgain').onclick = back ? ()=>{ show(CFG.mode==='duel'?'result':'aqua'); } : ()=>startSelected();
  if (acc>=90 && !back) confetti();
}

// ======================= WIRING =======================
$('btnStart').onclick=startSelected;
$('btnMenu').onclick=()=>{ show('start'); renderStart(); };
$('btnTheme').onclick=()=>{ CFG.theme = CFG.theme==='dark'?'light':'dark'; saveCfg(); applyTheme(); };
$('btnAccept').onclick=()=>{ const d=decodeDuel($('duelCode').value); if (!d){ $('duelErr').textContent='Код не распознан. Проверь 8 символов, например K3F9-A2X7.'; return; } $('duelErr').textContent=''; runDuel(d); };
$('duelCode').oninput=()=>{ $('duelErr').textContent=''; };
$('btnHome').onclick=()=>{ if (state.busy) return; const p=state.pending, s=state.sheetResolve; state.pending=null; state.sheetResolve=null; $('sheet').classList.remove('on'); $('sheetBg').classList.remove('on'); unseed(); state.topText=null; state.running=false; RUN=null; show('start'); renderStart(); if (p) p('__abort'); if (s) s('__abort'); };
$('btnNext').onclick=()=>closeSheet();
$('vAva').onclick=()=>{ if (!state.curOpp) return; $('dosBody').innerHTML=dossierHtml(state.curOpp); $('dossier').classList.add('on'); };
$('dossier').onclick=e=>{ if (e.target.id==='dossier' || e.target.id==='dosClose') $('dossier').classList.remove('on'); };
$('sheetBg').onclick=()=>{ if (!state.sheetResolve || !state.running) closeSheet(); };
$('btnMute').innerHTML=MUTE_SVG(SFX.muted);
$('btnMute').onclick=()=>{ $('btnMute').innerHTML=MUTE_SVG(SFX.toggle()); };
$('btnCopy').onclick=async()=>{ try{ await navigator.clipboard.writeText(state.share); toast('Скопировано'); }catch(e){ toast('Не удалось скопировать'); } };
if (!['short','full','aqua','duel'].includes(CFG.mode)) CFG.mode='short';
if (!CFG.theme) CFG.theme='light';
renderStart();

</script>
<script>
if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(()=>{}); }); }
// keep the status bar colour in step with the in-game theme
(function(){ const set=()=>{ const dark=document.documentElement.dataset.theme==='dark'; document.querySelectorAll('meta[name="theme-color"]').forEach(m=>m.setAttribute('content', dark?'#1D1A23':'#F2EFF5')); };
  new MutationObserver(set).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']}); set(); })();
</script>
